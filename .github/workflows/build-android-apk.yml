name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK (debug-signed, installable)
        run: |
          cd android
          chmod +x gradlew
          # Expo prebuild's `release` buildType signs with the bundled debug keystore,
          # so this produces a standalone, installable APK with no signing secrets.
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anipocket-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

name: Release (APK + IPA)

# Публикует сборки в GitHub Releases при пуше тега версии.
# Как выпустить релиз:
#   git tag v1.0.0
#   git push origin v1.0.0
# В разделе Releases появится релиз v1.0.0 с APK и IPA.
#
# Кнопкой "Run workflow" (workflow_dispatch) можно просто собрать
# артефакты без создания релиза.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания релиза и загрузки файлов

jobs:
  # ─────────────────────────── Android ───────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK (debug-signed, installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/AniPocket-${{ github.ref_name }}.apk"
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anipocket-apk
          path: dist/*.apk
          retention-days: 7

  # ───────────────────────────── iOS ─────────────────────────────
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Expo Prebuild (generate native iOS project)
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: Build unsigned archive
        run: |
          mkdir -p build
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using workspace: $WORKSPACE | scheme: $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log | grep -E "error:|ARCHIVE|PhaseScript|Invalid|Cannot|SyntaxError|Metro|bundle" || true

          if [ ! -d "build/app.xcarchive" ]; then
            echo "=== FULL BUILD LOG (last 100 lines) ==="
            tail -100 build/xcodebuild.log
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload dist
          APP=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -1)
          echo "Packaging app: $APP"
          cp -r "$APP" build/ipa/Payload/
          cd build/ipa
          zip -r "../../dist/AniPocket-${{ github.ref_name }}-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: anipocket-ipa
          path: dist/*.ipa
          retention-days: 7

  # ──────────────────────── Публикация релиза ────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    # Только при пуше тега (не при ручном запуске)
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: anipocket-apk
          path: dist

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: anipocket-ipa
          path: dist

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AniPocket ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.ipa
